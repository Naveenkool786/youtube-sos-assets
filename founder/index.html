<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FABRIQ — Founder Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #0B0E11;
  --bg-card: #141820;
  --bg-card-hover: #1A1F2A;
  --bg-dim: #0F1318;
  --fg: #E8ECF1;
  --fg-muted: #8B95A5;
  --fg-faint: #5A6577;
  --accent: #6C5CE7;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(108,92,231,0.15);
  --accent-glow: rgba(108,92,231,0.25);
  --warm: #F39C12;
  --warm-soft: rgba(243,156,18,0.12);
  --ok: #00D68F;
  --ok-soft: rgba(0,214,143,0.12);
  --warn: #FFB822;
  --warn-soft: rgba(255,184,34,0.12);
  --bad: #FF4757;
  --bad-soft: rgba(255,71,87,0.12);
  --blue: #339AF0;
  --blue-soft: rgba(51,154,240,0.12);
  --border: rgba(255,255,255,0.06);
  --border-accent: rgba(108,92,231,0.3);
  --divider: rgba(255,255,255,0.04);
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 100px;
  --font-display: "DM Serif Display", Georgia, serif;
  --font-body: "Inter", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; scroll-behavior: smooth; }
body {
  min-height: 100%; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* PIN Lock Screen */
.pin-lock {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.4s, transform 0.4s;
}
.pin-lock.unlocked { opacity: 0; transform: scale(1.05); pointer-events: none; }
.pin-logo {
  width: 64px; height: 64px; border-radius: 16px;
  background: linear-gradient(135deg, var(--accent), #8B5CF6);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 24px; box-shadow: 0 0 40px var(--accent-glow);
}
.pin-logo svg { width: 32px; height: 32px; }
.pin-title { font-family: var(--font-display); font-size: 28px; margin-bottom: 4px; }
.pin-sub { color: var(--fg-muted); font-size: 13px; margin-bottom: 32px; }
.pin-dots { display: flex; gap: 12px; margin-bottom: 28px; }
.pin-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--fg-faint); transition: all 0.2s;
}
.pin-dot.filled { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.pin-dot.error { background: var(--bad); border-color: var(--bad); animation: pin-shake 0.4s; }
.pin-pad { display: grid; grid-template-columns: repeat(3,72px); gap: 12px; }
.pin-key {
  width: 72px; height: 56px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg-card);
  color: var(--fg); font-size: 22px; font-weight: 600; font-family: var(--font-body);
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.pin-key:active, .pin-key:hover { background: var(--accent-soft); border-color: var(--accent); }
.pin-key.empty { visibility: hidden; }
.pin-key.back { font-size: 16px; }
.pin-error-msg { color: var(--bad); font-size: 12px; margin-top: 16px; min-height: 18px; }
@keyframes pin-shake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-8px); }
  40%,80% { transform: translateX(8px); }
}

/* Main Layout */
.console-wrap {
  max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px;
  display: none;
}
.console-wrap.visible { display: block; }

/* Top Bar */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 24px; border-bottom: 1px solid var(--divider);
  margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
}
.top-left { display: flex; align-items: center; gap: 14px; }
.top-logo {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #8B5CF6);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 20px var(--accent-glow);
}
.top-logo svg { width: 24px; height: 24px; }
.top-title { font-family: var(--font-display); font-size: 24px; }
.top-badge {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 3px 10px; border-radius: var(--radius-pill);
  background: var(--accent-soft); color: var(--accent); margin-left: 8px;
}
.top-right { display: flex; gap: 10px; flex-wrap: wrap; }
.launch-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--fg); font-size: 12px; font-weight: 600; font-family: var(--font-body);
  cursor: pointer; transition: all 0.2s; text-decoration: none;
}
.launch-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.launch-btn svg { width: 14px; height: 14px; }
.lock-btn {
  padding: 8px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--fg-faint); font-size: 12px; font-family: var(--font-body);
  cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px;
}
.lock-btn:hover { border-color: var(--bad); color: var(--bad); }

/* Status Banner */
.status-banner {
  display: flex; align-items: center; gap: 12px;
  background: linear-gradient(135deg, rgba(108,92,231,0.08), rgba(0,214,143,0.06));
  border: 1px solid var(--border-accent);
  border-radius: var(--radius); padding: 14px 20px; margin-bottom: 28px;
}
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); animation: pulse-dot 2s infinite; flex-shrink: 0; }
@keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.status-text { font-size: 13px; color: var(--fg-muted); }
.status-text strong { color: var(--fg); }
.status-date { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--fg-faint); flex-shrink: 0; }

/* KPI Grid */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 32px; }
.kpi-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 16px;
  transition: border-color 0.2s, transform 0.15s;
}
.kpi-card:hover { border-color: var(--border-accent); transform: translateY(-1px); }
.kpi-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--fg-faint); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.kpi-label .kpi-icon { width: 14px; height: 14px; opacity: 0.6; }
.kpi-value { font-family: var(--font-display); font-size: 30px; line-height: 1.1; margin-bottom: 4px; }
.kpi-delta { font-size: 11px; font-weight: 600; }
.kpi-delta.up { color: var(--ok); }
.kpi-delta.down { color: var(--bad); }
.kpi-delta.neutral { color: var(--fg-faint); }
.kpi-value.ok { color: var(--ok); } .kpi-value.warn { color: var(--warn); }
.kpi-value.bad { color: var(--bad); } .kpi-value.accent { color: var(--accent); }

/* Section Headers */
.section-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; margin-top: 8px;
}
.section-header h2 { font-family: var(--font-display); font-size: 20px; font-weight: 400; }
.section-header .section-count {
  font-size: 11px; font-weight: 700; padding: 2px 8px;
  border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent);
}
.section-line { flex: 1; height: 1px; background: var(--divider); }

/* Section Cards Grid */
.section-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-bottom: 36px; }
.s-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden;
}
.s-card:hover { border-color: var(--border-accent); background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
.s-card-icon {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.s-card-icon svg { width: 20px; height: 20px; }
.s-card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.s-card-desc { font-size: 12px; color: var(--fg-muted); line-height: 1.5; margin-bottom: 14px; }
.s-card-stats { display: flex; gap: 16px; flex-wrap: wrap; }
.s-stat { display: flex; flex-direction: column; }
.s-stat-val { font-family: var(--font-mono); font-size: 16px; font-weight: 700; }
.s-stat-label { font-size: 10px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: 0.05em; }
.s-card-badge {
  position: absolute; top: 14px; right: 14px;
  font-size: 10px; font-weight: 700; padding: 3px 8px;
  border-radius: var(--radius-pill); text-transform: uppercase; letter-spacing: 0.04em;
}

/* Badge colors */
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-bad { background: var(--bad-soft); color: var(--bad); }
.badge-blue { background: var(--blue-soft); color: var(--blue); }
.badge-accent { background: var(--accent-soft); color: var(--accent); }

/* Activity Timeline */
.timeline { display: flex; flex-direction: column; gap: 0; margin-bottom: 36px; }
.tl-item {
  display: flex; gap: 14px; padding: 12px 0;
  border-bottom: 1px solid var(--divider);
}
.tl-dot-col { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; padding-top: 4px; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.tl-line { width: 2px; flex: 1; background: var(--divider); margin-top: 4px; }
.tl-content { flex: 1; min-width: 0; }
.tl-title { font-size: 13px; font-weight: 500; }
.tl-meta { font-size: 11px; color: var(--fg-faint); margin-top: 2px; }

/* Quick Actions */
.quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 36px; }
.quick-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--fg); font-size: 13px; font-weight: 500; font-family: var(--font-body);
  cursor: pointer; transition: all 0.2s; text-decoration: none;
}
.quick-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.quick-btn svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.6; }

/* Detail Panel (Slide-over) */
.detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.detail-overlay.show { opacity: 1; pointer-events: auto; }
.detail-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 201;
  width: 520px; max-width: 92vw; background: var(--bg-dim);
  border-left: 1px solid var(--border);
  transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.detail-panel.show { transform: translateX(0); }
.detail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
}
.detail-header h3 { font-family: var(--font-display); font-size: 18px; }
.detail-close {
  width: 32px; height: 32px; border: none; border-radius: 8px;
  background: var(--bg-card); color: var(--fg-faint); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  transition: all 0.15s;
}
.detail-close:hover { background: var(--bad-soft); color: var(--bad); }
.detail-body { flex: 1; overflow-y: auto; padding: 24px; }
.detail-body .d-section { margin-bottom: 24px; }
.detail-body .d-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-faint); margin-bottom: 8px; }
.detail-body .d-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--divider); font-size: 13px; }
.detail-body .d-row-val { font-weight: 600; font-family: var(--font-mono); }
.detail-body .d-bar-wrap { height: 8px; background: var(--bg-card); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.detail-body .d-bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.detail-body .d-list { list-style: none; }
.detail-body .d-list li { padding: 8px 0; border-bottom: 1px solid var(--divider); font-size: 13px; display: flex; justify-content: space-between; }
.detail-body .d-tag { display: inline-block; padding: 2px 8px; border-radius: var(--radius-pill); font-size: 10px; font-weight: 600; }

/* Responsive */
@media (max-width: 640px) {
  .console-wrap { padding: 16px 12px 40px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .section-grid { grid-template-columns: 1fr; }
  .quick-grid { grid-template-columns: 1fr 1fr; }
  .top-bar { gap: 8px; }
  .status-banner { flex-wrap: wrap; }
  .status-date { margin-left: 0; }
  .pin-pad { grid-template-columns: repeat(3,64px); gap: 8px; }
  .pin-key { width: 64px; height: 48px; font-size: 20px; }
}
</style>
</head>
<body>

<!-- PIN Lock -->
<div class="pin-lock" id="pinLock">
  <div class="pin-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M4 8L12 4L20 8L12 12Z"/><path d="M4 12L12 16L20 12"/></svg>
  </div>
  <div class="pin-title">Founder Console</div>
  <div class="pin-sub">Enter your 4-digit PIN to continue</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="pin-pad" id="pinPad">
    <button class="pin-key" onclick="pinInput(1)">1</button>
    <button class="pin-key" onclick="pinInput(2)">2</button>
    <button class="pin-key" onclick="pinInput(3)">3</button>
    <button class="pin-key" onclick="pinInput(4)">4</button>
    <button class="pin-key" onclick="pinInput(5)">5</button>
    <button class="pin-key" onclick="pinInput(6)">6</button>
    <button class="pin-key" onclick="pinInput(7)">7</button>
    <button class="pin-key" onclick="pinInput(8)">8</button>
    <button class="pin-key" onclick="pinInput(9)">9</button>
    <button class="pin-key empty"></button>
    <button class="pin-key" onclick="pinInput(0)">0</button>
    <button class="pin-key back" onclick="pinBack()">&larr;</button>
  </div>
  <div class="pin-error-msg" id="pinError"></div>
</div>

<!-- Main Console -->
<div class="console-wrap" id="consoleWrap">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-left">
      <div class="top-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M4 8L12 4L20 8L12 12Z"/><path d="M4 12L12 16L20 12"/></svg>
      </div>
      <div>
        <div style="display:flex;align-items:center">
          <span class="top-title">Founder Console</span>
          <span class="top-badge">Private</span>
        </div>
        <div style="font-size:12px;color:var(--fg-faint)">FABRIQ QMS &mdash; Command Center</div>
      </div>
    </div>
    <div class="top-right">
      <a class="launch-btn" href="../web/" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Web Demo
      </a>
      <a class="launch-btn" href="../pwa/" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        Mobile Demo
      </a>
      <button class="lock-btn" onclick="lockConsole()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Lock
      </button>
    </div>
  </div>

  <!-- Status Banner -->
  <div class="status-banner">
    <div class="status-dot"></div>
    <div class="status-text"><strong>Current Focus:</strong> Name decision + Customer discovery sprint + CTO search</div>
    <div class="status-date" id="todayDate"></div>
  </div>

  <!-- KPI Dashboard -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- Business Sections -->
  <div class="section-header">
    <h2>Business Operations</h2>
    <span class="section-count">11 areas</span>
    <div class="section-line"></div>
  </div>
  <div class="section-grid" id="sectionGrid"></div>

  <!-- Quick Actions -->
  <div class="section-header">
    <h2>Quick Actions</h2>
    <div class="section-line"></div>
  </div>
  <div class="quick-grid" id="quickGrid"></div>

  <!-- Activity Log -->
  <div class="section-header">
    <h2>Activity Log</h2>
    <span class="section-count" id="activityCount">0</span>
    <div class="section-line"></div>
  </div>
  <div class="timeline" id="timeline"></div>

</div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <h3 id="detailTitle">Detail</h3>
    <button class="detail-close" onclick="closeDetail()">&times;</button>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<script>
// PIN System
var CORRECT_PIN = '2024';
var pinEntry = '';

function pinInput(n) {
  if (pinEntry.length >= 4) return;
  pinEntry += n;
  updatePinDots();
  if (pinEntry.length === 4) {
    setTimeout(checkPin, 200);
  }
}
function pinBack() {
  pinEntry = pinEntry.slice(0, -1);
  updatePinDots();
  document.getElementById('pinError').textContent = '';
}
function updatePinDots() {
  var dots = document.querySelectorAll('.pin-dot');
  dots.forEach(function(d, i) {
    d.className = 'pin-dot' + (i < pinEntry.length ? ' filled' : '');
  });
}
function checkPin() {
  if (pinEntry === CORRECT_PIN) {
    document.getElementById('pinLock').classList.add('unlocked');
    document.getElementById('consoleWrap').classList.add('visible');
    try { sessionStorage.setItem('fabriq_founder_auth', '1'); } catch(e){}
    setTimeout(function(){ document.getElementById('pinLock').style.display = 'none'; }, 400);
  } else {
    document.querySelectorAll('.pin-dot').forEach(function(d){ d.className = 'pin-dot error'; });
    document.getElementById('pinError').textContent = 'Incorrect PIN. Try again.';
    setTimeout(function(){
      pinEntry = '';
      updatePinDots();
    }, 600);
  }
}
function lockConsole() {
  try { sessionStorage.removeItem('fabriq_founder_auth'); } catch(e){}
  location.reload();
}

// Auto-unlock if already authenticated this session
(function(){
  try {
    if (sessionStorage.getItem('fabriq_founder_auth') === '1') {
      document.getElementById('pinLock').style.display = 'none';
      document.getElementById('consoleWrap').classList.add('visible');
    }
  } catch(e){}
})();

// Date
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

// KPI Data
var KPIS = [
  { label:'Pre-Seed Target', value:'$500K', icon:'dollar', delta:null, color:'' },
  { label:'Monthly Burn', value:'$0', icon:'fire', delta:'Pre-revenue', color:'ok' },
  { label:'Runway', value:'∞', icon:'clock', delta:'Bootstrap phase', color:'ok' },
  { label:'Team Size', value:'1', icon:'users', delta:'Founder only', color:'neutral' },
  { label:'Open Roles', value:'4', icon:'briefcase', delta:'CTO + 3 engineers', color:'warn' },
  { label:'Pipeline Value', value:'$0', icon:'chart', delta:'Pre-sales', color:'neutral' },
  { label:'Target Customers', value:'95', icon:'target', delta:'Discovery list ready', color:'accent' },
  { label:'Prototype', value:'v0.1', icon:'code', delta:'Live on gh-pages', color:'ok' },
  { label:'Blueprint', value:'v1.0', icon:'doc', delta:'12 topics locked', color:'ok' },
  { label:'Pitch Deck', value:'v1', icon:'slides', delta:'12 slides ready', color:'ok' },
  { label:'Financial Model', value:'5yr', icon:'calc', delta:'Projections complete', color:'ok' },
  { label:'Docs Created', value:'25+', icon:'folder', delta:'All deliverables', color:'accent' }
];

function renderKpis() {
  var g = document.getElementById('kpiGrid');
  g.innerHTML = KPIS.map(function(k) {

function openDetail(id) {
  var d = DETAIL_DATA[id];
  if (!d) return;
  document.getElementById('detailTitle').textContent = d.title;
  document.getElementById('detailBody').innerHTML = d.html;
  document.getElementById('detailOverlay').classList.add('show');
  document.getElementById('detailPanel').classList.add('show');
}
function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('show');
  document.getElementById('detailPanel').classList.remove('show');
}

// Toast
function showToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--border);color:var(--fg);padding:10px 20px;border-radius:var(--radius-pill);font-size:13px;z-index:999;box-shadow:var(--shadow-lg);opacity:0;transition:opacity 0.3s';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity = '1'; });
  setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 300); }, 2500);
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (document.getElementById('pinLock').style.display !== 'none' && !document.getElementById('pinLock').classList.contains('unlocked')) {
    if (e.key >= '0' && e.key <= '9') pinInput(parseInt(e.key));
    if (e.key === 'Backspace') pinBack();
    return;
  }
  if (e.key === 'Escape') closeDetail();
});

renderKpis();
renderSections();
renderQuickActions();
renderTimeline();
