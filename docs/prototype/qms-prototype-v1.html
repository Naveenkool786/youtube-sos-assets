<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QMS Prototype v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
<style>
:root {
  --bg: #fafbfc;
  --surface: #ffffff;
  --surface-elev: #ffffff;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --text: #0f172a;
  --text-muted: #64748b;
  --text-subtle: #94a3b8;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-soft: #eef2ff;
  --success: #10b981;
  --success-soft: #ecfdf5;
  --warning: #f59e0b;
  --warning-soft: #fffbeb;
  --danger: #ef4444;
  --danger-soft: #fef2f2;
  --info: #0ea5e9;
  --info-soft: #f0f9ff;
}
:root[data-theme="dark"] {
  --bg: #0b1120;
  --surface: #0f172a;
  --surface-elev: #1e293b;
  --border: #1e293b;
  --border-strong: #334155;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  --primary: #818cf8;
  --primary-soft: #1e1b4b;
  --success-soft: #064e3b;
  --warning-soft: #78350f;
  --danger-soft: #7f1d1d;
  --info-soft: #0c4a6e;
}
body { background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; margin: 0; }
.card { background: var(--surface-elev); border: 1px solid var(--border); border-radius: 12px; }
.btn { padding: 0.5rem 0.875rem; border-radius: 8px; font-weight: 500; font-size: 0.875rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.375rem; border: 1px solid transparent; transition: all 0.15s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-elev); }
.btn-danger { background: var(--danger); color: white; }
.btn-sm { padding: 0.25rem 0.625rem; font-size: 0.75rem; }
.chip { padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.25rem; }
.chip-success { background: var(--success-soft); color: var(--success); }
.chip-warning { background: var(--warning-soft); color: var(--warning); }
.chip-danger { background: var(--danger-soft); color: var(--danger); }
.chip-info { background: var(--info-soft); color: var(--info); }
.chip-neutral { background: var(--border); color: var(--text-muted); }
.chip-primary { background: var(--primary-soft); color: var(--primary); }
input, select, textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.875rem; color: var(--text); width: 100%; font-family: inherit; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: var(--primary); }
label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 0.25rem; }
@keyframes slide-in { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.toast { animation: slide-in 0.3s ease; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.dot-live { animation: pulse-dot 1.5s ease-in-out infinite; }
.phone-frame { width: 320px; height: 620px; background: #0f172a; border-radius: 44px; padding: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); margin: 0 auto; }
.phone-screen { background: var(--surface); width: 100%; height: 100%; border-radius: 36px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
.phone-notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #0f172a; border-radius: 20px; z-index: 10; }
.scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
.scrollbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
.scrollbar::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ============ ICONS ============
const Icon = ({ name, size = 16, className = "" }) => {

    "trash": <><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>,

    "alert": <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></>,
    "dollar": <><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>,
    "chevron-right": <><polyline points="9 18 15 12 9 6"/></>,
    "camera": <><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></>,
    "download": <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>,
    "refresh": <><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></>,
    "settings": <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
    "info": <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>,
  };
  return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{p[name]}</svg>;
};

// ============ DATA LAYER (localStorage) ============
const STORAGE_KEY = 'qms_v1_data';
const SEED = {
  session: null,
  users: [
    { id: 'u-brand', name: 'Sarah Chen', role: 'brand', title: 'Head of Quality', org: 'Brand A', avatar: 'S', color: 'var(--primary)' },
    { id: 'u-factory', name: 'Rahman Khan', role: 'factory', title: 'Production Manager', org: 'Factory 1 · Dhaka', avatar: 'R', color: 'var(--success)' },
    { id: 'u-inspector', name: 'Priya Nair', role: 'inspector', title: 'Field Inspector', org: 'InspectionCo', avatar: 'P', color: 'var(--warning)' },
  ],
  styles: [
    { id: 's-1', code: 'STY-001', name: 'Classic Oxford Shirt', category: 'Shirt', brand: 'Brand A' },
    { id: 's-2', code: 'STY-002', name: 'Chino Trousers', category: 'Trouser', brand: 'Brand A' },
    { id: 's-3', code: 'STY-003', name: 'Polo T-Shirt', category: 'T-shirt', brand: 'Brand A' },
    { id: 's-4', code: 'STY-004', name: 'Denim Jacket', category: 'Jacket', brand: 'Brand A' },
  ],
  factories: [
    { id: 'f-1', name: 'Factory 1', country: 'Bangladesh', city: 'Dhaka', score: 92 },
    { id: 'f-2', name: 'Factory 2', country: 'Vietnam', city: 'HCMC', score: 85 },
    { id: 'f-3', name: 'Factory 3', country: 'India', city: 'Tirupur', score: 94 },
  ],
  pos: [
    { id: 'po-001', number: 'PO-2026-0142', style_id: 's-1', factory_id: 'f-1', qty: 5000, state: 'in_production', created_at: Date.now() - 7 * 86400000, due_date: '2026-12-15' },
    { id: 'po-002', number: 'PO-2026-0143', style_id: 's-2', factory_id: 'f-3', qty: 8000, state: 'ready_for_inspection', created_at: Date.now() - 3 * 86400000, due_date: '2026-11-28' },
  ],
  inspections: [],
  defects: [],
  ncrs: [],
  coq_entries: [
    { id: 'coq-1', category: 'prevention', subcategory: 'Fabric inspection', amount: 4200, created_at: Date.now() - 30 * 86400000 },
    { id: 'coq-2', category: 'prevention', subcategory: 'Training', amount: 8200, created_at: Date.now() - 20 * 86400000 },
    { id: 'coq-3', category: 'appraisal', subcategory: 'Inline QC', amount: 15200, created_at: Date.now() - 15 * 86400000 },
    { id: 'coq-4', category: 'appraisal', subcategory: 'Lab testing', amount: 13400, created_at: Date.now() - 10 * 86400000 },
    { id: 'coq-5', category: 'internal_failure', subcategory: 'Rework', amount: 25000, created_at: Date.now() - 8 * 86400000 },
    { id: 'coq-6', category: 'internal_failure', subcategory: 'Scrap', amount: 17300, created_at: Date.now() - 5 * 86400000 },
    { id: 'coq-7', category: 'external_failure', subcategory: 'Returns', amount: 48000, created_at: Date.now() - 3 * 86400000 },
    { id: 'coq-8', category: 'external_failure', subcategory: 'Warranty', amount: 36200, created_at: Date.now() - 1 * 86400000 },
  ],
};
const loadData = () => { try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : SEED; } catch (e) { return SEED; } };
const saveData = (d) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) { console.error(e); } };
const resetData = () => { localStorage.removeItem(STORAGE_KEY); location.reload(); };

// ============ STATE MACHINE ============
const PO_STATES = {
  draft: { label: 'Draft', color: 'chip-neutral', next: ['sent'] },
  sent: { label: 'Sent to Factory', color: 'chip-info', next: ['accepted', 'rejected'] },
  accepted: { label: 'Accepted', color: 'chip-info', next: ['in_production'] },
  rejected: { label: 'Rejected', color: 'chip-danger', next: [] },
  in_production: { label: 'In Production', color: 'chip-primary', next: ['ready_for_inspection'] },
  ready_for_inspection: { label: 'Ready for Inspection', color: 'chip-warning', next: ['passed', 'failed'] },
  passed: { label: 'Inspection Passed', color: 'chip-success', next: ['shipped'] },
  failed: { label: 'Inspection Failed', color: 'chip-danger', next: ['in_production'] },
  shipped: { label: 'Shipped', color: 'chip-success', next: ['delivered'] },
  delivered: { label: 'Delivered', color: 'chip-success', next: [] },
};
const INSP_STATES = {
  scheduled: { label: 'Scheduled', color: 'chip-info' },
  in_progress: { label: 'In Progress', color: 'chip-warning' },
  submitted: { label: 'Submitted', color: 'chip-primary' },
  passed: { label: 'Passed', color: 'chip-success' },
  failed: { label: 'Failed', color: 'chip-danger' },
};
const NCR_STATES = {
  raised: { label: 'Raised', color: 'chip-danger' },
  acknowledged: { label: 'Acknowledged', color: 'chip-warning' },
  resolved: { label: 'Resolved', color: 'chip-success' },
};

// ============ DEFECT CATALOG ============
const DEFECT_CATEGORIES = [
  { code: 'OPEN_SEAM', name: 'Open seam', severity: 'major' },
  { code: 'LOOSE_BUTTON', name: 'Loose button', severity: 'major' },
  { code: 'STAIN', name: 'Stain / spot', severity: 'minor' },
  { code: 'BROKEN_STITCH', name: 'Broken stitch', severity: 'minor' },
  { code: 'WRONG_COLOR', name: 'Wrong color shade', severity: 'critical' },
  { code: 'HOLE', name: 'Fabric hole', severity: 'critical' },
  { code: 'LABEL_MISSING', name: 'Label missing', severity: 'major' },
  { code: 'SIZE_WRONG', name: 'Size out of tolerance', severity: 'major' },
];
const GARMENT_ZONES = ['Collar', 'Placket', 'Sleeve', 'Cuff', 'Side-seam', 'Hem', 'Pocket', 'Front panel', 'Back panel', 'Lining'];

// ============ TOAST ============
let toastId = 0;
const useToast = () => {
  const [toasts, setToasts] = useState([]);
  const show = (msg, type = 'success') => {
    const id = ++toastId;
    setToasts(ts => [...ts, { id, msg, type }]);
    setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 3000);
  };
  const ToastBar = () => (
    <div className="fixed top-4 right-4 z-[200] space-y-2">
      {toasts.map(t => (
        <div key={t.id} className={`toast card px-4 py-3 shadow-lg flex items-center gap-2 ${t.type === 'error' ? 'border-red-400' : 'border-green-400'}`} style={{ minWidth: 240 }}>
          <Icon name={t.type === 'error' ? 'x' : 'check'} size={14} style={{ color: t.type === 'error' ? 'var(--danger)' : 'var(--success)' }} />
          <span className="text-sm">{t.msg}</span>
        </div>
      ))}
    </div>
  );
  return { show, ToastBar };
};

// ============ MAIN APP ============
function App() {
  const [data, setData] = useState(loadData);
  const [theme, setTheme] = useState('light');
  const [route, setRoute] = useState('/');
  const { show: toast, ToastBar } = useToast();

  useEffect(() => saveData(data), [data]);
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);

  const update = (fn) => setData(d => fn({ ...d }));
  const session = data.session ? data.users.find(u => u.id === data.session) : null;

  const goto = (r) => { setRoute(r); window.scrollTo(0, 0); };

  const login = (userId) => { update(d => { d.session = userId; return d; }); goto('/'); toast(`Welcome, ${data.users.find(u => u.id === userId).name}`); };
  const logout = () => { update(d => { d.session = null; return d; }); goto('/'); };

  if (!session) {
    return (
      <>
        <ToastBar />
        <LoginScreen users={data.users} onLogin={login} theme={theme} setTheme={setTheme} />
      </>
    );
  }

  return (
    <>
      <ToastBar />
      <TopBar session={session} data={data} logout={logout} theme={theme} setTheme={setTheme} toast={toast} goto={goto} route={route} update={update} />
      <main className="pb-20">
        <Router route={route} session={session} data={data} update={update} toast={toast} goto={goto} />
      </main>
    </>
  );
}

// ============ LOGIN ============
const LoginScreen = ({ users, onLogin, theme, setTheme }) => (
  <div className="min-h-screen flex items-center justify-center p-4">
    <div className="w-full max-w-2xl">
      <div className="text-center mb-8">
        <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4" style={{ background: 'linear-gradient(135deg, var(--primary), #8b5cf6)' }}>
          <Icon name="layout" size={28} className="text-white" />
        </div>
        <h1 className="text-4xl font-bold mb-2">QMS Platform <span className="chip chip-info text-xs ml-2">v1 Prototype</span></h1>
        <p className="text-sm mb-6" style={{ color: 'var(--text-muted)' }}>Three-party Quality Management for apparel. Pick a persona to log in.</p>
      </div>
      <div className="grid md:grid-cols-3 gap-3">
        {users.map(u => (
          <button key={u.id} onClick={() => onLogin(u.id)} className="card p-5 text-left hover:shadow-lg transition-all hover:scale-[1.02]">
            <div className="w-12 h-12 rounded-full grid place-items-center text-white text-xl font-bold mb-3" style={{ background: u.color }}>{u.avatar}</div>
            <div className="font-semibold">{u.name}</div>
            <div className="text-xs" style={{ color: 'var(--text-muted)' }}>{u.title}</div>
            <div className="text-xs mt-1" style={{ color: 'var(--text-subtle)' }}>{u.org}</div>
            <div className="mt-3"><span className={`chip chip-${u.role === 'brand' ? 'primary' : u.role === 'factory' ? 'success' : 'warning'}`}>{u.role.toUpperCase()}</span></div>
          </button>
        ))}
      </div>
      <div className="text-center mt-8 space-y-2">
        <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="btn btn-ghost">{theme === 'dark' ? '☀️ Light' : '🌙 Dark'} mode</button>
        <div className="text-xs" style={{ color: 'var(--text-subtle)' }}>All data stored in your browser's localStorage. No backend. No account needed.</div>
      </div>
    </div>
  </div>
);

// ============ TOP BAR ============
const TopBar = ({ session, data, logout, theme, setTheme, toast, goto, route, update }) => {
  const [menuOpen, setMenuOpen] = useState(false);
  const navItems = {
    brand: [
      { r: '/', label: 'Dashboard', icon: 'layout' },
      { r: '/pos', label: 'Purchase Orders', icon: 'clipboard' },
      { r: '/create-po', label: 'New PO', icon: 'plus' },
      { r: '/inspections', label: 'Inspections', icon: 'check' },
      { r: '/ncrs', label: 'NCRs', icon: 'alert' },
      { r: '/coq', label: 'Cost of Quality', icon: 'dollar' },
    ],
    factory: [
      { r: '/', label: 'Dashboard', icon: 'layout' },
      { r: '/kanban', label: 'PO Board', icon: 'factory' },
      { r: '/inspections', label: 'Inspections', icon: 'check' },
      { r: '/ncrs', label: 'NCRs', icon: 'alert' },
    ],
    inspector: [
      { r: '/', label: 'Today', icon: 'map-pin' },
      { r: '/my-inspections', label: 'My Inspections', icon: 'check' },
    ],
  };
  const items = navItems[session.role] || [];

  return (
    <>
      <nav className="sticky top-0 z-40" style={{ background: 'var(--surface)', borderBottom: '1px solid var(--border)' }}>
        <div className="max-w-[1400px] mx-auto px-4 py-3 flex items-center gap-3">
          <button onClick={() => goto('/')} className="flex items-center gap-2 pr-3" style={{ borderRight: '1px solid var(--border)' }}>
            <div className="w-7 h-7 rounded-lg grid place-items-center" style={{ background: 'linear-gradient(135deg, var(--primary), #8b5cf6)' }}>
              <Icon name="layout" size={14} className="text-white" />
            </div>
            <span className="font-bold text-sm hidden sm:inline">QMS</span>
            <span className="chip chip-info text-[10px]">v1</span>
          </button>
          <div className="flex items-center gap-1 overflow-x-auto scrollbar flex-1">
            {items.map(i => (
              <button key={i.r} onClick={() => goto(i.r)} className={`btn ${route === i.r ? 'btn-primary' : 'btn-ghost'} whitespace-nowrap text-xs`}>
                <Icon name={i.icon} size={14} />
                <span className="hidden md:inline">{i.label}</span>
              </button>
            ))}
          </div>
          <button onClick={() => setMenuOpen(!menuOpen)} className="flex items-center gap-2 btn btn-ghost text-xs">
            <div className="w-6 h-6 rounded-full grid place-items-center text-white font-bold text-xs" style={{ background: session.color }}>{session.avatar}</div>
            <span className="hidden sm:inline">{session.name.split(' ')[0]}</span>
          </button>
        </div>
      </nav>
      {menuOpen && (
        <div className="fixed right-4 top-16 z-50 card p-2 w-64 shadow-xl">
          <div className="p-3 border-b" style={{ borderColor: 'var(--border)' }}>
            <div className="font-semibold text-sm">{session.name}</div>
            <div className="text-xs" style={{ color: 'var(--text-muted)' }}>{session.title}</div>

// ============ ROUTER ============
const Router = ({ route, session, data, update, toast, goto }) => {
  const props = { data, update, toast, goto, session };
  // Brand routes
  if (session.role === 'brand') {
    if (route === '/') return <BrandDashboard {...props} />;
    if (route === '/pos') return <POList {...props} />;
    if (route === '/create-po') return <CreatePO {...props} />;
    if (route === '/inspections') return <AllInspections {...props} />;
    if (route === '/ncrs') return <NCRList {...props} />;
    if (route === '/coq') return <CoQDashboard {...props} />;
    if (route.startsWith('/po/')) return <PODetail {...props} id={route.split('/')[2]} />;
    if (route.startsWith('/insp/')) return <InspectionDetail {...props} id={route.split('/')[2]} />;
  }
  // Factory routes
  if (session.role === 'factory') {
    if (route === '/') return <FactoryDashboard {...props} />;
    if (route === '/kanban') return <KanbanBoard {...props} />;
    if (route === '/inspections') return <AllInspections {...props} />;
    if (route === '/ncrs') return <NCRList {...props} />;
    if (route.startsWith('/po/')) return <PODetail {...props} id={route.split('/')[2]} />;
    if (route.startsWith('/insp/')) return <InspectionDetail {...props} id={route.split('/')[2]} />;
  }
  // Inspector routes (mobile)
  if (session.role === 'inspector') {
    if (route === '/') return <InspectorToday {...props} />;
    if (route === '/my-inspections') return <AllInspections {...props} />;
    if (route.startsWith('/insp/')) return <InspectionExecute {...props} id={route.split('/')[2]} />;
  }
  return <div className="p-8">Route not found</div>;
};

const InspectionDetail = ({ data, update, toast, goto, id, session }) => {
  const insp = data.inspections.find(i => i.id === id);
  if (!insp) return <div className="p-8">Inspection not found</div>;
  const po = data.pos.find(p => p.id === insp.po_id);
  const defects = data.defects.filter(d => d.inspection_id === id);
  const critical = defects.filter(d => d.severity === 'critical').reduce((s, d) => s + d.count, 0);
  const major = defects.filter(d => d.severity === 'major').reduce((s, d) => s + d.count, 0);
  const minor = defects.filter(d => d.severity === 'minor').reduce((s, d) => s + d.count, 0);
  const sampleSize = Math.min(200, po?.qty || 200);
  const majorLimit = Math.floor(sampleSize * insp.aql_major / 100);
  const minorLimit = Math.floor(sampleSize * insp.aql_minor / 100);
  const willPass = critical === 0 && major <= majorLimit && minor <= minorLimit;

  const raiseNCR = () => {
    const ncr = { id: 'NCR-' + String(Date.now()).slice(-5), po_id: insp.po_id, inspection_id: id, severity: critical > 0 ? 'critical' : major > majorLimit ? 'major' : 'minor', description: `Inspection failed: ${critical} critical, ${major} major, ${minor} minor defects`, state: 'raised', created_at: Date.now() };
    update(d => { d.ncrs = [...d.ncrs, ncr]; d.pos = d.pos.map(p => p.id === insp.po_id ? { ...p, state: 'failed' } : p); d.inspections = d.inspections.map(i => i.id === id ? { ...i, state: 'failed' } : i); return d; });
    toast('NCR raised. PO marked as Inspection Failed.');
  };
  const approve = () => {
    update(d => { d.pos = d.pos.map(p => p.id === insp.po_id ? { ...p, state: 'passed' } : p); d.inspections = d.inspections.map(i => i.id === id ? { ...i, state: 'passed' } : i); return d; });
    toast('Inspection approved. PO ready to ship.');
  };

  return (
    <div className="max-w-[1200px] mx-auto px-4 py-6">
      <button onClick={() => goto('/inspections')} className="btn btn-ghost mb-4"><Icon name="arrow-left" size={14} /> Back</button>
      <div className="flex items-start justify-between mb-6 flex-wrap gap-4">
        <div>
          <div className="font-mono text-sm font-bold" style={{ color: 'var(--text-muted)' }}>{id.slice(-12)}</div>
          <h1 className="text-2xl font-bold">{insp.type.toUpperCase()} Inspection</h1>
          <div className="text-sm mt-1" style={{ color: 'var(--text-muted)' }}>{po?.number} · AQL Level {insp.aql_level}</div>
        </div>
        <div className="flex items-center gap-2">
          <span className={`chip ${INSP_STATES[insp.state]?.color}`}>{INSP_STATES[insp.state]?.label}</span>
          {insp.state === 'submitted' && session.role === 'brand' && (
            <>
              {willPass ? <button onClick={approve} className="btn btn-primary btn-sm">✓ Approve</button> : <button onClick={raiseNCR} className="btn btn-danger btn-sm">⚠ Raise NCR</button>}
            </>
          )}
        </div>
      </div>

      <div className="grid md:grid-cols-4 gap-3 mb-4">
        <div className="card p-4 text-center">
          <div className="text-xs" style={{ color: 'var(--text-muted)' }}>Sample Size</div>
          <div className="text-2xl font-bold">{sampleSize}</div>
        </div>
        <div className="card p-4 text-center" style={{ background: critical > 0 ? 'var(--danger-soft)' : '' }}>
          <div className="text-xs" style={{ color: 'var(--text-muted)' }}>Critical (max 0)</div>
          <div className="text-2xl font-bold" style={{ color: critical > 0 ? 'var(--danger)' : 'var(--success)' }}>{critical}</div>
        </div>
        <div className="card p-4 text-center" style={{ background: major > majorLimit ? 'var(--danger-soft)' : '' }}>
          <div className="text-xs" style={{ color: 'var(--text-muted)' }}>Major (max {majorLimit})</div>
          <div className="text-2xl font-bold" style={{ color: major > majorLimit ? 'var(--danger)' : 'var(--success)' }}>{major}</div>
        </div>
        <div className="card p-4 text-center" style={{ background: minor > minorLimit ? 'var(--danger-soft)' : '' }}>
          <div className="text-xs" style={{ color: 'var(--text-muted)' }}>Minor (max {minorLimit})</div>
          <div className="text-2xl font-bold" style={{ color: minor > minorLimit ? 'var(--danger)' : 'var(--success)' }}>{minor}</div>
        </div>
      </div>

      {insp.state === 'submitted' && (
        <div className="card p-4 mb-4 flex items-center justify-between" style={{ background: willPass ? 'var(--success-soft)' : 'var(--danger-soft)' }}>
          <div className="flex items-center gap-2">
            <Icon name={willPass ? 'check' : 'x'} size={18} style={{ color: willPass ? 'var(--success)' : 'var(--danger)' }} />
            <span className="font-semibold" style={{ color: willPass ? 'var(--success)' : 'var(--danger)' }}>
              Verdict: {willPass ? 'PASS — within AQL limits' : 'FAIL — exceeds AQL'}
            </span>
          </div>
        </div>
      )}

      <div className="card p-5">
        <h3 className="font-semibold text-sm mb-3">Defects Logged ({defects.length})</h3>
        <table className="w-full text-sm">
          <thead style={{ color: 'var(--text-muted)' }} className="text-xs">
            <tr><th className="text-left pb-2">Defect</th><th className="text-left pb-2">Zone</th><th className="text-left pb-2">Severity</th><th className="text-right pb-2">Count</th></tr>
          </thead>
          <tbody>
            {defects.map(d => {
              const dc = DEFECT_CATEGORIES.find(c => c.code === d.category);
              return (
                <tr key={d.id} className="border-t" style={{ borderColor: 'var(--border)' }}>
                  <td className="py-2">{dc?.name}</td>
                  <td className="py-2 text-xs" style={{ color: 'var(--text-muted)' }}>{d.zone}</td>
                  <td className="py-2"><span className={`chip ${d.severity === 'critical' ? 'chip-danger' : d.severity === 'major' ? 'chip-warning' : 'chip-info'}`}>{d.severity}</span></td>
                  <td className="py-2 text-right font-mono font-bold">{d.count}</td>
                </tr>
              );
            })}
            {defects.length === 0 && <tr><td colSpan="4" className="py-6 text-center text-sm" style={{ color: 'var(--text-subtle)' }}>No defects logged.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
};

              </div>
              <div className="rounded-lg p-2" style={{ background: 'var(--bg)' }}>
                <div className="text-[9px]" style={{ color: 'var(--text-muted)' }}>Minor</div>
                <div className="text-lg font-bold">{minor}</div>
              </div>
            </div>

            <div className="card p-3">
              <div className="text-[10px] font-semibold uppercase mb-2" style={{ color: 'var(--text-muted)' }}>Add Defect</div>
              <div className="space-y-2">
                <select value={newDefect.category} onChange={e => setNewDefect({ ...newDefect, category: e.target.value })} className="text-xs">
                  {DEFECT_CATEGORIES.map(c => <option key={c.code} value={c.code}>{c.name} ({c.severity})</option>)}
                </select>
                <select value={newDefect.zone} onChange={e => setNewDefect({ ...newDefect, zone: e.target.value })} className="text-xs">
                  {GARMENT_ZONES.map(z => <option key={z} value={z}>{z}</option>)}
                </select>
                <div className="flex gap-2">
                  <input type="number" value={newDefect.count} onChange={e => setNewDefect({ ...newDefect, count: parseInt(e.target.value) || 1 })} min="1" className="text-xs flex-1" />
                  <button onClick={addDefect} className="btn btn-primary text-xs">+ Add</button>
                </div>
              </div>
            </div>

            <div className="space-y-1">
              <div className="text-[10px] font-semibold uppercase" style={{ color: 'var(--text-muted)' }}>Logged ({existing.length})</div>
              {existing.map(d => {
                const cat = DEFECT_CATEGORIES.find(c => c.code === d.category);
                return (
                  <div key={d.id} className="flex items-center justify-between p-2 rounded-lg text-xs" style={{ background: 'var(--bg)' }}>
                    <div>
                      <div className="font-semibold">{cat?.name} ×{d.count}</div>
                      <div className="text-[10px]" style={{ color: 'var(--text-muted)' }}>{d.zone} · {d.severity}</div>
                    </div>
                    <button onClick={() => removeDefect(d.id)} className="text-red-500"><Icon name="x" size={12} /></button>
                  </div>
                );
              })}
            </div>

            {insp.state !== 'submitted' && insp.state !== 'passed' && insp.state !== 'failed' && (
              <button onClick={submit} className="btn btn-primary w-full justify-center text-xs">Submit Inspection</button>
            )}
          </div>
        </div>
      </div>
      <div className="text-center mt-4 text-xs" style={{ color: 'var(--text-subtle)' }}>
        Mobile view · all data persists in your browser
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
