  --warning: #f59e0b;
  --warning-soft: #fffbeb;
  --danger: #ef4444;
  --danger-soft: #fef2f2;
  --info: #0ea5e9;
  --info-soft: #f0f9ff;
}
:root[data-theme="dark"], :root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --bg: #0b1120;
    --surface: #0f172a;
    --surface-elevated: #1e293b;
    --border: #1e293b;
    --border-strong: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
    --primary: #818cf8;
    --primary-soft: #1e1b4b;
    --success-soft: #064e3b;
    --warning-soft: #78350f;
    --danger-soft: #7f1d1d;
    --info-soft: #0c4a6e;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120;
  --surface: #0f172a;
  --surface-elevated: #1e293b;
  --border: #1e293b;
  --border-strong: #334155;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  --primary: #818cf8;
  --primary-soft: #1e1b4b;
  --success-soft: #064e3b;
  --warning-soft: #78350f;
  --danger-soft: #7f1d1d;
  --info-soft: #0c4a6e;
}
body { background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.card { background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 12px; }
.btn { padding: 0.5rem 0.875rem; border-radius: 8px; font-weight: 500; font-size: 0.875rem; transition: all 0.15s; cursor: pointer; display: inline-flex; align-items: center; gap: 0.375rem; border: 1px solid transparent; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-elevated); }
.chip { padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.25rem; }
.chip-success { background: var(--success-soft); color: var(--success); }
.chip-warning { background: var(--warning-soft); color: var(--warning); }
.chip-danger { background: var(--danger-soft); color: var(--danger); }
.chip-info { background: var(--info-soft); color: var(--info); }
.chip-neutral { background: var(--border); color: var(--text-muted); }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.dot-live { animation: pulse-dot 1.5s ease-in-out infinite; }
@keyframes defect-float { 0% { transform: translateY(0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-80px) scale(1.2); opacity: 0; } }
.defect-bubble { animation: defect-float 3s ease-out infinite; }
@keyframes worker-walk { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(15px); } }
.worker-dot { animation: worker-walk 4s ease-in-out infinite; }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.shimmer { background: linear-gradient(90deg, var(--border) 25%, var(--surface-elevated) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 2s linear infinite; }
.phone-frame { width: 320px; height: 650px; background: #0f172a; border-radius: 44px; padding: 10px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
.phone-screen { background: var(--surface); width: 100%; height: 100%; border-radius: 36px; overflow: hidden; position: relative; }
.phone-notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #0f172a; border-radius: 20px; z-index: 10; }
.tablet-frame { width: 580px; height: 420px; background: #0f172a; border-radius: 20px; padding: 10px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
.tablet-screen { background: var(--surface); width: 100%; height: 100%; border-radius: 12px; overflow: hidden; position: relative; }
.scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
.scrollbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
input, select, textarea { font-family: inherit; }
</style>

                  <div className="absolute defect-bubble w-5 h-5 rounded-full grid place-items-center text-[10px] font-bold text-white" style={{background: '#f59e0b', left: '60%', bottom: '20px'}}>!</div>

// ============ APP ============
function App() {
  const [screen, setScreen] = useState('landing');
  const [dark, setDark] = useState(false);
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);
  const screens = {
    landing: <Landing setScreen={setScreen}/>,
    brandDash: <BrandDashboard setScreen={setScreen}/>,
    createPO: <CreatePO setScreen={setScreen}/>,
    factoryKanban: <FactoryKanban setScreen={setScreen}/>,
    inspectorMobile: <InspectorMobile setScreen={setScreen}/>,
    fabricTablet: <FabricTablet setScreen={setScreen}/>,
    inspection: <InspectionExecution setScreen={setScreen}/>,
    ncrCapa: <NCRCAPA setScreen={setScreen}/>,
    liveFloor: <LiveFloor setScreen={setScreen}/>,
    coqScene: <CoQScene setScreen={setScreen}/>,
